<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pour nous</title><link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f1115"><link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pour nous">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262a33;--tx:#e8eaed;--mut:#9aa0a6;--ac:#8ab4f8;color-scheme:dark}
@media(prefers-color-scheme:light){:root[data-t=auto]{--bg:#f6f7f9;--card:#fff;--line:#e2e5ea;--tx:#1f2328;--mut:#5f6670;--ac:#1a73e8;color-scheme:light}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:720px;margin:0 auto;padding:12px 14px 110px}
h1{font-size:22px;margin:10px 0}h2{font-size:15px;color:var(--mut);font-weight:600;margin:18px 0 6px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:5px 0}
.btn{background:var(--ac);color:#0b1220;border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer}
.btn.g{background:transparent;color:var(--ac);border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}
.row .t{flex:1;min-width:0;word-break:break-word}.row small{color:var(--mut);display:block}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--mut);background:none;flex:none;cursor:pointer;padding:0}
.chk.on{background:var(--ac);border-color:var(--ac)}.done .t{text-decoration:line-through;color:var(--mut)}
.ic{background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer}.ic.on{color:#fbbc04}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0}.tabs button{white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 14px;cursor:pointer}
.tabs button.on{background:var(--ac);color:#0b1220;border-color:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:var(--mut);padding:6px 8px;font-size:12px;cursor:pointer}nav button.on{color:var(--ac)}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;font-size:30px;padding:0;box-shadow:0 4px 14px #0008}
.sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet>div{background:var(--bg);width:100%;max-width:720px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.msg{background:var(--card);border-radius:14px;padding:9px 12px;margin:8px 0}.msg b{font-size:13px;color:var(--ac)}.msg small{color:var(--mut)}
.err{color:#f28b82;min-height:20px}.mut{color:var(--mut)}.c{text-align:center}
</style></head><body data-x><div id="app"></div>
<script>
// ====== À REMPLIR (Supabase > Project Settings > API) ======
const SUPABASE_URL='https://czlybdqzjlqzsboohzxr.supabase.co', SUPABASE_KEY='sb_publishable_dyqkfKWuPAKXqtBAugRzXg_l78ZyQyT';
// ===========================================================
document.documentElement.dataset.t='auto';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Date(d).toLocaleString('fr-FR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const S={user:null,me:null,view:'tasks',list:'Mes tâches',tasks:[],events:[],msgs:[],docs:[],members:[],err:''};
const LISTS=['Mes tâches','Tâches collectives','Travail de groupe','Favoris'];

async function boot(){
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
  const {data:{session}}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((_e,s)=>{if((s?.user?.id||0)!==(S.user?.id||0))start(s?.user)});
  start(session?.user);
}
async function start(u){
  S.user=u||null;if(!u){S.me=null;return login()}
  await load();render();
  sb.channel('live').on('postgres_changes',{event:'*',schema:'public'},()=>load().then(()=>{if(!$('.sheet'))render()})).subscribe();
  setInterval(checkReminders,30000);checkReminders();
}
async function load(){
  const [t,e,m,d,p]=await Promise.all([
    sb.from('tasks').select('*').order('created_at',{ascending:false}),
    sb.from('events').select('*').order('starts_at'),
    sb.from('messages').select('*').order('created_at').limit(200),
    sb.from('documents').select('*').order('created_at',{ascending:false}),
    sb.from('profiles').select('*').order('name')]);
  S.tasks=t.data||[];S.events=e.data||[];S.msgs=m.data||[];S.docs=d.data||[];S.members=p.data||[];
  S.me=S.members.find(x=>x.id===S.user.id)||{name:'',role:'student'};
}
function login(mode='in'){
  app.innerHTML=`<div style="margin-top:12vh"><h1 class="c">Pour nous</h1><p class="c mut">L'espace de la promo : tâches, agenda, messages, documents.</p>
  ${mode==='up'?'<input id="n" placeholder="Prénom et nom" autocomplete="name">':''}
  <input id="e" type="email" placeholder="E-mail" autocomplete="email"><input id="p" type="password" placeholder="Mot de passe (8 caractères min.)" autocomplete="${mode==='up'?'new-password':'current-password'}">
  <p class="err" id="err"></p><button class="btn" style="width:100%" id="go">${mode==='up'?'Créer mon compte':'Se connecter'}</button>
  <p class="c"><button class="btn g" id="sw">${mode==='up'?'J\'ai déjà un compte':'Créer un compte'}</button></p></div>`;
  $('#sw').onclick=()=>login(mode==='up'?'in':'up');
  $('#go').onclick=async()=>{const email=$('#e').value.trim(),password=$('#p').value;let r;
    if(mode==='up'){r=await sb.auth.signUp({email,password,options:{data:{name:$('#n').value.trim()}}});
      if(!r.error&&!r.data.session){$('#err').textContent='Compte créé. Confirme ton e-mail puis connecte-toi.';return}}
    else r=await sb.auth.signInWithPassword({email,password});
    if(r.error)$('#err').textContent=r.error.message};
}
function render(){
  const tabs=[['tasks','✓','Tâches'],['agenda','📅','Agenda'],['chat','💬','Messages'],['docs','📄','Documents'],['members','👥','Membres']];
  app.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h1>Pour nous</h1><button class="btn g" id="out">Déconnexion</button></div>
  <div id="main">${V[S.view]()}</div>
  <nav>${tabs.map(t=>`<button class="${S.view===t[0]?'on':''}" data-v="${t[0]}"><div style="font-size:20px">${t[1]}</div>${t[2]}</button>`).join('')}</nav>`;
  $('#out').onclick=()=>sb.auth.signOut();
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render()});
  W[S.view]?.();
}
function sheet(html){const d=document.createElement('div');d.className='sheet';d.innerHTML=`<div>${html}</div>`;d.onclick=e=>{if(e.target===d)d.remove()};document.body.append(d);return d}
const own=(x,k)=>x[k]===S.user.id||S.me.role==='admin';
const V={
 tasks(){const L=[...LISTS,...new Set(S.tasks.map(t=>t.list).filter(l=>!LISTS.includes(l)))];
  const vis=S.tasks.filter(t=>S.list==='Favoris'?t.starred:t.list===S.list);
  return `<div class="tabs">${L.map(l=>`<button class="${l===S.list?'on':''}" data-l="${esc(l)}">${esc(l)}</button>`).join('')}</div>
  ${vis.length?vis.map(t=>`<div class="row ${t.done?'done':''}"><button class="chk ${t.done?'on':''}" data-d="${t.id}"></button>
   <div class="t">${esc(t.title)}<small>${t.scope==='private'?'🔒 privée':'👥 collective'}${t.assignee?' · '+esc(t.assignee):''}${t.due?' · '+fmt(t.due):''}</small></div>
   <button class="ic ${t.starred?'on':''}" data-s="${t.id}">★</button>${own(t,'owner')?`<button class="ic" data-x="${t.id}">✕</button>`:''}</div>`).join(''):'<p class="mut c">Rien ici. Appuie sur + pour ajouter une tâche.</p>'}
  <button class="btn fab" id="add">+</button>`},
 agenda(){const up=S.events.filter(e=>new Date(e.starts_at)>Date.now()-864e5);
  return `<h2>À venir</h2>${up.length?up.map(e=>`<div class="row"><div class="t">${esc(e.title)}<small>${fmt(e.starts_at)}${e.location?' · '+esc(e.location):''}</small></div>${own(e,'created_by')?`<button class="ic" data-xe="${e.id}">✕</button>`:''}</div>`).join(''):'<p class="mut c">Aucun événement.</p>'}
  <button class="btn fab" id="add">+</button>`},
 chat(){return `${S.msgs.map(m=>`<div class="msg"><b>${esc(m.author_name)}</b> <small>${fmt(m.created_at)}</small>${own(m,'author')?` <button class="ic" style="font-size:14px" data-xm="${m.id}">✕</button>`:''}<div>${esc(m.body)}</div></div>`).join('')||'<p class="mut c">Aucun message.</p>'}
  <div style="position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));max-width:720px;margin:auto;padding:8px 14px;background:var(--bg);display:flex;gap:8px"><input id="mb" placeholder="Écrire à la promo…" style="margin:0"><button class="btn" id="send">Envoyer</button></div>`},
 docs(){return `${S.docs.length?S.docs.map(d=>`<div class="row"><div class="t">${esc(d.title)}<small>${d.size?(d.size/1048576).toFixed(1)+' Mo · ':''}${fmt(d.created_at)}</small></div><button class="btn g" data-dl="${d.id}">Ouvrir</button>${own(d,'uploaded_by')?`<button class="ic" data-xd="${d.id}">✕</button>`:''}</div>`).join(''):'<p class="mut c">Aucun document partagé.</p>'}
  <button class="btn fab" id="add">+</button>`},
 members(){return `<h2>${S.members.length} membres</h2>${S.members.map(m=>`<div class="row"><div class="t">${esc(m.name)}<small>${m.role==='admin'?'Administrateur':'Étudiant'}</small></div>${S.me.role==='admin'&&m.id!==S.user.id?`<button class="btn g" data-r="${m.id}" data-ro="${m.role}">${m.role==='admin'?'Retirer admin':'Rendre admin'}</button>`:''}</div>`).join('')}
  <h2>Notifications</h2><button class="btn g" id="notif">Activer les rappels</button>`}
};
const W={
 tasks(){
  document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.list=b.dataset.l;render()});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{const t=S.tasks.find(x=>x.id===b.dataset.d);await sb.from('tasks').update({done:!t.done}).eq('id',t.id)});
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{const t=S.tasks.find(x=>x.id===b.dataset.s);await sb.from('tasks').update({starred:!t.starred}).eq('id',t.id)});
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>confirm('Supprimer cette tâche ?')&&sb.from('tasks').delete().eq('id',b.dataset.x));
  $('#add').onclick=()=>{const s=sheet(`<h1>Nouvelle tâche</h1><input id="tt" placeholder="Titre"><select id="ts"><option value="private">🔒 Privée (juste moi)</option><option value="shared">👥 Collective (toute la promo)</option></select>
   <input id="tl" placeholder="Liste (ex. Travail de groupe)" value="${esc(S.list==='Favoris'?'Mes tâches':S.list)}"><input id="ta" placeholder="Responsable (optionnel)">
   <label class="mut">Échéance</label><input id="td" type="datetime-local"><label class="mut">Rappel</label><input id="tr" type="datetime-local">
   <button class="btn" style="width:100%;margin-top:8px" id="ok">Enregistrer</button>`);
   s.querySelector('#ok').onclick=async()=>{const v=i=>s.querySelector(i).value;if(!v('#tt').trim())return;
    const iso=x=>x?new Date(x).toISOString():null;
    await sb.from('tasks').insert({title:v('#tt').trim(),scope:v('#ts'),list:v('#tl').trim()||'Mes tâches',assignee:v('#ta').trim()||null,due:iso(v('#td')),remind_at:iso(v('#tr'))});s.remove()}}},
 agenda(){document.querySelectorAll('[data-xe]').forEach(b=>b.onclick=()=>confirm('Supprimer ?')&&sb.from('events').delete().eq('id',b.dataset.xe));
  $('#add').onclick=()=>{const s=sheet(`<h1>Nouvel événement</h1><input id="et" placeholder="Titre"><input id="ed" type="datetime-local"><input id="el" placeholder="Lieu (optionnel)"><button class="btn" style="width:100%;margin-top:8px" id="ok">Enregistrer</button>`);
   s.querySelector('#ok').onclick=async()=>{const t=s.querySelector('#et').value.trim(),d=s.querySelector('#ed').value;if(!t||!d)return;
    await sb.from('events').insert({title:t,starts_at:new Date(d).toISOString(),location:s.querySelector('#el').value.trim()||null});s.remove()}}},
 chat(){scrollTo(0,document.body.scrollHeight);
  const go=async()=>{const b=$('#mb').value.trim();if(!b)return;$('#mb').value='';await sb.from('messages').insert({body:b,author_name:S.me.name})};
  $('#send').onclick=go;$('#mb').onkeydown=e=>e.key==='Enter'&&go();
  document.querySelectorAll('[data-xm]').forEach(b=>b.onclick=()=>sb.from('messages').delete().eq('id',b.dataset.xm))},
 docs(){
  document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{const d=S.docs.find(x=>x.id===b.dataset.dl);
   const {data}=await sb.storage.from('docs').createSignedUrl(d.path,120,{download:d.title});if(data)window.open(data.signedUrl,'_blank')});
  document.querySelectorAll('[data-xd]').forEach(b=>b.onclick=async()=>{if(!confirm('Supprimer ?'))return;const d=S.docs.find(x=>x.id===b.dataset.xd);await sb.storage.from('docs').remove([d.path]);await sb.from('documents').delete().eq('id',d.id)});
  $('#add').onclick=()=>{const s=sheet(`<h1>Partager un document</h1><input id="df" type="file"><p class="err" id="er"></p><button class="btn" style="width:100%" id="ok">Envoyer (20 Mo max)</button>`);
   s.querySelector('#ok').onclick=async()=>{const f=s.querySelector('#df').files[0];if(!f)return;
    const path=`${S.user.id}/${Date.now()}-${f.name.replace(/[^\w.\-]/g,'_')}`;
    const up=await sb.storage.from('docs').upload(path,f);if(up.error){s.querySelector('#er').textContent=up.error.message;return}
    await sb.from('documents').insert({title:f.name,path,size:f.size});s.remove()}}},
 members(){$('#notif').onclick=async()=>{const r=await Notification.requestPermission?.();$('#notif').textContent=r==='granted'?'Rappels activés ✓':'Autorisation refusée'};
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>sb.from('profiles').update({role:b.dataset.ro==='admin'?'student':'admin'}).eq('id',b.dataset.r).then(load).then(render))}
};
function notify(t,b){try{if(Notification.permission==='granted')navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:b,icon:'/icons/icon-192.png'}))}catch(e){}}
function checkReminders(){const seen=JSON.parse(localStorage.getItem('pn-seen')||'[]'),now=Date.now(),add=[];
  S.tasks.filter(t=>!t.done&&t.remind_at&&new Date(t.remind_at)<=now&&now-new Date(t.remind_at)<864e5&&!seen.includes('t'+t.id)&&(t.owner===S.user.id||t.scope==='shared')).forEach(t=>{notify('Rappel',t.title);add.push('t'+t.id)});
  S.events.filter(e=>{const d=new Date(e.starts_at)-now;return d>0&&d<36e5&&!seen.includes('e'+e.id)}).forEach(e=>{notify('Dans moins d\'1 h',e.title);add.push('e'+e.id)});
  if(add.length)localStorage.setItem('pn-seen',JSON.stringify([...seen,...add].slice(-300)))}
boot();
</script></body></html>
