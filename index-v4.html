<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pour nous</title><link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f1115"><link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pour nous">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#10141b;--card:#171c25;--line:#252c39;--tx:#e7e9ee;--mut:#98a1b2;--ac:#9db8ff;--on:#0c1424;--star:#e6b450;--c1:#8ab4ff;--c2:#5fd3a6;--c3:#c4a1ff;--c4:#ffb86b;--c5:#ff8fa3;color-scheme:dark}
:root[data-t=light]{--bg:#f4f5f7;--card:#ffffff;--line:#dcdfe6;--tx:#17202e;--mut:#5b6678;--ac:#1f3a6e;--on:#ffffff;--star:#b7791f;--c1:#1f4fa8;--c2:#0f7a55;--c3:#6b3fb5;--c4:#b25e09;--c5:#b8324f;color-scheme:light}
@media(prefers-color-scheme:light){:root[data-t=auto]{--bg:#f4f5f7;--card:#ffffff;--line:#dcdfe6;--tx:#17202e;--mut:#5b6678;--ac:#1f3a6e;--on:#ffffff;--star:#b7791f;--c1:#1f4fa8;--c2:#0f7a55;--c3:#6b3fb5;--c4:#b25e09;--c5:#b8324f;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 'Source Sans 3',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:720px;margin:0 auto;padding:14px 16px 120px}
h1{font:600 30px/1.15 'Newsreader',Georgia,'Times New Roman',serif;letter-spacing:-.01em;margin:8px 0 14px}
h2{font:600 18px 'Newsreader',Georgia,serif;margin:22px 0 6px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin:5px 0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:8px;padding:11px 16px;font-weight:600;cursor:pointer}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--line);padding:7px 12px;font-size:15px;font-weight:500}
.row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.row .t{flex:1;min-width:0;word-break:break-word}.row small{color:var(--mut);display:block;font-size:14px;margin-top:2px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-right:6px}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--mut);background:none;flex:none;cursor:pointer;padding:0;position:relative}
.chk.on{background:var(--ac);border-color:var(--ac)}
.chk.on::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:var(--on);font-size:14px;font-weight:700}
.done .t{text-decoration:line-through;color:var(--mut)}
.ic{background:none;border:0;color:var(--mut);font-size:19px;cursor:pointer;padding:4px}.ic.on{color:var(--star)}
.tabs{display:flex;gap:18px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:4px}
.tabs button{white-space:nowrap;background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 2px;color:var(--mut);cursor:pointer;margin-bottom:-1px}
.tabs button.on{color:var(--tx);border-bottom-color:var(--ac);font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:0 0 env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;border-top:2px solid transparent;color:var(--mut);padding:14px 2px;font-size:13px;cursor:pointer}
nav button.on{color:var(--ac);border-top-color:var(--ac);font-weight:600}
.fab{position:fixed;right:18px;bottom:calc(var(--nh,60px) + 16px);width:56px;height:56px;border-radius:50%;font-size:30px;padding:0;box-shadow:0 4px 14px #0006}
.sheet{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet>div{background:var(--bg);width:100%;max-width:720px;border-radius:16px 16px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.msg{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 13px;margin:8px 0}
.msg b{font:600 16px 'Newsreader',Georgia,serif;color:var(--ac)}.msg small{color:var(--mut)}
.err{color:#e5736b;min-height:20px}.mut{color:var(--mut)}.c{text-align:center}
.brand{font:600 20px 'Newsreader',Georgia,serif}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}.stat b{display:block;font:600 30px/1.1 'Newsreader',Georgia,serif}.stat span{color:var(--mut);font-size:14px}.stat.warn b,.lt{color:#e5736b}
.date{width:46px;flex:none;text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px 0;background:var(--card)}.date b{display:block;font:600 20px/1.1 'Newsreader',Georgia,serif}.date span{font-size:12px;color:var(--mut);text-transform:uppercase}
.prog{height:4px;background:var(--line);border-radius:2px;margin:10px 0 4px}.prog i{display:block;height:100%;background:var(--ac);border-radius:2px;transition:width .3s}
.av{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;color:var(--ac)}
.msg.me{margin-left:14%;background:var(--ac);color:var(--on);border-color:transparent}.msg.me b,.msg.me small{color:var(--on);opacity:.85}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nh,60px) + 20px);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:20;font-size:15px}
:root[data-v=tasks]{--ac:var(--c1)}:root[data-v=agenda]{--ac:var(--c2)}:root[data-v=chat]{--ac:var(--c3)}:root[data-v=docs]{--ac:var(--c4)}:root[data-v=members]{--ac:var(--c5)}
.stat{border-top:3px solid var(--line)}
.date.ev{border-color:var(--c2)}.date.ev b{color:var(--c2)}.date.fi{border-color:var(--c4)}.date.fi b{color:var(--c4)}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><div id="app"></div>
<script>
// ====== À REMPLIR (Supabase > Project Settings > API) ======
const SUPABASE_URL='https://czlybdqzjlqzsboohzxr.supabase.co', SUPABASE_KEY='sb_publishable_dyqkfKWuPAKXqtBAugRzXg_l78ZyQyT';
// ===========================================================
let TH='dark';try{TH=localStorage.getItem('pn-theme')||'dark'}catch(e){}
const THL={dark:'Sombre',light:'Clair',auto:'Auto'};
function setTheme(v){TH=v;document.documentElement.dataset.t=v;try{localStorage.setItem('pn-theme',v)}catch(e){}
 const lt=v==='light'||(v==='auto'&&matchMedia('(prefers-color-scheme:light)').matches);document.querySelector('meta[name=theme-color]').content=lt?'#f4f5f7':'#10141b'}
setTheme(TH);
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Date(d).toLocaleString('fr-FR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const S={user:null,me:null,view:'home',list:'Mes tâches',tasks:[],events:[],msgs:[],docs:[],members:[],err:''};
const LISTS=['Mes tâches','Tâches collectives','Travail de groupe','Favoris'];

async function boot(){
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
  const {data:{session}}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((_e,s)=>{if((s?.user?.id||0)!==(S.user?.id||0))start(s?.user)});
  start(session?.user);
}
async function start(u){
  S.user=u||null;if(!u){S.me=null;return login()}
  await load();render();
  sb.channel('live').on('postgres_changes',{event:'*',schema:'public'},()=>load().then(()=>{if(!$('.sheet'))render()})).subscribe();
  setInterval(checkReminders,30000);checkReminders();
}
async function load(){
  const [t,e,m,d,p]=await Promise.all([
    sb.from('tasks').select('*').order('created_at',{ascending:false}),
    sb.from('events').select('*').order('starts_at'),
    sb.from('messages').select('*').order('created_at').limit(200),
    sb.from('documents').select('*').order('created_at',{ascending:false}),
    sb.from('profiles').select('*').order('name')]);
  S.tasks=t.data||[];S.events=e.data||[];S.msgs=m.data||[];S.docs=d.data||[];S.members=p.data||[];
  S.me=S.members.find(x=>x.id===S.user.id)||{name:'',role:'student'};
}
function login(mode='in'){
  app.innerHTML=`<div style="margin-top:12vh"><h1 class="c">Pour nous</h1><p class="c mut">L'espace de la promo : tâches, agenda, messages, documents.</p>
  ${mode==='up'?'<input id="n" placeholder="Prénom et nom" autocomplete="name">':''}
  <input id="e" type="email" placeholder="E-mail" autocomplete="email"><input id="p" type="password" placeholder="Mot de passe (8 caractères min.)" autocomplete="${mode==='up'?'new-password':'current-password'}">
  <p class="err" id="err"></p><button class="btn" style="width:100%" id="go">${mode==='up'?'Créer mon compte':'Se connecter'}</button>
  <p class="c"><button class="btn g" id="sw">${mode==='up'?'J\'ai déjà un compte':'Créer un compte'}</button></p></div>`;
  $('#sw').onclick=()=>login(mode==='up'?'in':'up');
  $('#go').onclick=async()=>{const email=$('#e').value.trim(),password=$('#p').value;let r;
    if(mode==='up'){r=await sb.auth.signUp({email,password,options:{data:{name:$('#n').value.trim()}}});
      if(!r.error&&!r.data.session){$('#err').textContent='Compte créé. Confirme ton e-mail puis connecte-toi.';return}}
    else r=await sb.auth.signInWithPassword({email,password});
    if(r.error)$('#err').textContent=r.error.message};
}
function render(){
  document.documentElement.dataset.v=S.view;
  const dr=$('#mb')?.value,had=document.activeElement?.id==='mb';
  const tabs=[['home','','Accueil'],['tasks','','Tâches'],['agenda','','Agenda'],['chat','','Messages'],['docs','','Fichiers'],['members','','Promo']];
  app.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><div class="brand">Pour nous</div><span><button class="btn g" id="th">${THL[TH]}</button> <button class="btn g" id="out">Déconnexion</button></span></div>
  <div id="main">${V[S.view]()}</div>
  <nav>${tabs.map(t=>`<button class="${S.view===t[0]?'on':''}" data-v="${t[0]}">${t[2]}</button>`).join('')}</nav>`;
  $('#out').onclick=()=>sb.auth.signOut();
  document.documentElement.style.setProperty('--nh',($('nav').offsetHeight||60)+'px');
  $('#th').onclick=()=>{setTheme({dark:'light',light:'auto',auto:'dark'}[TH]);render()};
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render()});
  W[S.view]?.();
  if(dr&&$('#mb')){$('#mb').value=dr;if(had)$('#mb').focus()}
}
function sheet(html){const d=document.createElement('div');d.className='sheet';d.innerHTML=`<div>${html}</div>`;d.onclick=e=>{if(e.target===d)d.remove()};document.body.append(d);return d}
async function del(table,id,q){if(!confirm(q))return;const r=await sb.from(table).delete().eq('id',id);if(r.error)return alert('Erreur : '+r.error.message);await load();render()}
const own=(x,k)=>x[k]===S.user.id||S.me.role==='admin';
const rel=d=>{const n=Math.round((new Date(d)-Date.now())/864e5);return n<=0?"aujourd'hui":n===1?'demain':'dans '+n+' j'};
const ini=n=>(n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const loc=d=>d?new Date(new Date(d)-new Date(d).getTimezoneOffset()*6e4).toISOString().slice(0,16):'';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}
function taskForm(t){const ed=!!t,s=sheet(`<h1>${ed?'Modifier la tâche':'Nouvelle tâche'}</h1><input id="tt" placeholder="Titre" value="${esc(t?.title)}">
 ${ed?'':'<select id="ts"><option value="private">Privée (visible par moi seul)</option><option value="shared">Collective (visible par toute la promo)</option></select>'}
 <input id="tl" placeholder="Liste (ex. Travail de groupe)" value="${esc(t?.list||(S.list==='Favoris'?'Mes tâches':S.list))}"><input id="ta" placeholder="Responsable (optionnel)" value="${esc(t?.assignee)}">
 <label class="mut">Échéance</label><input id="td" type="datetime-local" value="${loc(t?.due)}"><label class="mut">Rappel</label><input id="tr" type="datetime-local" value="${loc(t?.remind_at)}">
 <button class="btn" style="width:100%;margin-top:8px" id="ok">Enregistrer</button>`);
 s.querySelector('#ok').onclick=async()=>{const v=i=>s.querySelector(i).value,iso=x=>x?new Date(x).toISOString():null;if(!v('#tt').trim())return;
  const row={title:v('#tt').trim(),list:v('#tl').trim()||'Mes tâches',assignee:v('#ta').trim()||null,due:iso(v('#td')),remind_at:iso(v('#tr'))};
  const r=ed?await sb.from('tasks').update(row).eq('id',t.id):await sb.from('tasks').insert({...row,scope:v('#ts')});
  if(r.error)return toast('Erreur : '+r.error.message);s.remove();await load();render();toast('Enregistré')}}
const evRow=(e,x)=>{const d=new Date(e.starts_at);return `<div class="row"><div class="date ev"><b>${d.getDate()}</b><span>${d.toLocaleDateString('fr-FR',{month:'short'})}</span></div><div class="t">${esc(e.title)}<small>${d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}${e.location?' · '+esc(e.location):''} · ${rel(e.starts_at)}</small></div>${x&&own(e,'created_by')?`<button class="ic" data-xe="${e.id}">✕</button>`:''}</div>`};
const V={
 home(){const n=(S.me.name||'').split(' ')[0],mine=S.tasks.filter(t=>!t.done&&(t.owner===S.user.id||t.scope==='shared')),
  late=mine.filter(t=>t.due&&new Date(t.due)<Date.now()),nxt=S.events.filter(e=>new Date(e.starts_at)>Date.now()).slice(0,3),last=S.msgs[S.msgs.length-1];
  return `<p class="mut" style="margin:6px 0 0">${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</p>
  <h1>${new Date().getHours()<18?'Bonjour':'Bonsoir'}${n?', '+esc(n):''}</h1>
  <div class="stats"><div class="stat" style="border-top-color:var(--c1)"><b>${mine.length}</b><span>à faire</span></div><div class="stat ${late.length?'warn':''}"><b>${late.length}</b><span>en retard</span></div><div class="stat" style="border-top-color:var(--c5)"><b>${S.members.length}</b><span>membres</span></div></div>
  <h2 style="color:var(--c2)">Prochains événements</h2>${nxt.length?nxt.map(e=>evRow(e)).join(''):'<p class="mut">Rien de prévu.</p>'}
  <h2 style="color:var(--c3)">Dernier message</h2>${last?`<div class="msg" style="border-left:3px solid var(--c3)"><b style="color:var(--c3)">${esc(last.author_name)}</b> <small>${fmt(last.created_at)}</small><div>${esc(last.body)}</div></div>`:'<p class="mut">Aucun message.</p>'}`},
 tasks(){const L=[...LISTS,...new Set(S.tasks.map(t=>t.list).filter(l=>!LISTS.includes(l)))],
  base=S.tasks.filter(t=>S.list==='Favoris'?t.starred:t.list===S.list),dn=base.filter(t=>t.done).length,q=(S.q||'').toLowerCase(),
  vis=base.filter(t=>(S.show==='all'||!t.done)&&(!q||t.title.toLowerCase().includes(q)));
  return `<h1>Tâches</h1><div class="tabs">${L.map(l=>`<button class="${l===S.list?'on':''}" data-l="${esc(l)}">${esc(l)}</button>`).join('')}</div>
  <div class="prog"><i style="width:${base.length?dn/base.length*100:0}%"></i></div><small class="mut">${dn} sur ${base.length} terminées</small>
  <div style="display:flex;gap:8px;margin:8px 0"><input id="q" placeholder="Rechercher…" value="${esc(S.q)}" style="margin:0"><button class="btn g" id="sh" style="white-space:nowrap">${S.show==='all'?'Masquer terminées':'Voir terminées'}</button></div>
  ${vis.length?vis.map(t=>{const lt=t.due&&!t.done&&new Date(t.due)<Date.now();return `<div class="row ${t.done?'done':''}"><button class="chk ${t.done?'on':''}" data-d="${t.id}"></button>
   <div class="t" ${own(t,'owner')||t.scope==='shared'?`data-e="${t.id}" style="cursor:pointer"`:''}>${esc(t.title)}<small><span class="tag">${t.scope==='private'?'Privée':'Collective'}</span>${t.assignee?esc(t.assignee)+' · ':''}${t.due?`<span class="${lt?'lt':''}">échéance ${fmt(t.due)}</span>`:''}</small></div>
   <button class="ic ${t.starred?'on':''}" data-s="${t.id}">★</button>${own(t,'owner')?`<button class="ic" data-x="${t.id}">✕</button>`:''}</div>`}).join(''):'<p class="mut c" style="margin-top:30px">Rien ici. Appuie sur + pour ajouter une tâche.</p>'}
  <button class="btn fab" id="add">+</button>`},
 agenda(){const up=S.events.filter(e=>new Date(e.starts_at)>Date.now()-864e5);
  return `<h1>Agenda</h1>${up.length?up.map(e=>evRow(e,1)).join(''):'<p class="mut c" style="margin-top:30px">Aucun événement. Appuie sur + pour en créer un.</p>'}<button class="btn fab" id="add">+</button>`},
 chat(){return `<h1>Messages</h1>${S.msgs.map(m=>`<div class="msg ${m.author===S.user.id?'me':''}"><b>${esc(m.author_name)}</b> <small>${fmt(m.created_at)}</small>${own(m,'author')?` <button class="ic" style="font-size:14px;color:inherit" data-xm="${m.id}">✕</button>`:''}<div>${esc(m.body)}</div></div>`).join('')||'<p class="mut c">Aucun message. Écris le premier.</p>'}<div style="display:flex;gap:8px;margin-top:14px"><input id="mb" placeholder="Écrire à la promo…" style="margin:0" autocomplete="off" enterkeyhint="send"><button class="btn" id="send">Envoyer</button></div>`},
 docs(){return `<h1>Fichiers</h1>${S.docs.length?S.docs.map(d=>`<div class="row"><div class="date fi"><b style="font-size:13px;padding:5px 0">${esc((d.title.split('.').pop()||'').slice(0,4).toUpperCase())}</b></div><div class="t">${esc(d.title)}<small>${d.size?(d.size/1048576).toFixed(1)+' Mo · ':''}${fmt(d.created_at)}</small></div><button class="btn g" data-dl="${d.id}">Ouvrir</button>${own(d,'uploaded_by')?`<button class="ic" data-xd="${d.id}">✕</button>`:''}</div>`).join(''):'<p class="mut c" style="margin-top:30px">Aucun fichier partagé.</p>'}
  <button class="btn fab" id="add">+</button>`},
 members(){return `<h1>La promo</h1><h2>${S.members.length} membres</h2>${S.members.map(m=>`<div class="row"><div class="av">${esc(ini(m.name))}</div><div class="t">${esc(m.name)}<small>${m.role==='admin'?'Administrateur':'Étudiant'}</small></div>${S.me.role==='admin'&&m.id!==S.user.id?`<button class="btn g" data-r="${m.id}" data-ro="${m.role}">${m.role==='admin'?'Retirer admin':'Rendre admin'}</button>`:''}</div>`).join('')}
  <h2>Rappels</h2><button class="btn g" id="notif">Activer les notifications</button>
  <h2>Installer l'application</h2><p class="mut" style="margin:0"><b>iPhone</b> : ouvre le site dans Safari, puis Partager, puis « Sur l'écran d'accueil ».<br><b>Android</b> : dans Chrome, menu ⋮, puis « Installer l'application ».</p><p class="mut" style="margin-top:28px;font-size:13px">Version 4</p>`}
};
const W={
 tasks(){
  document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.list=b.dataset.l;render()});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{const t=S.tasks.find(x=>x.id===b.dataset.d);await sb.from('tasks').update({done:!t.done}).eq('id',t.id)});
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{const t=S.tasks.find(x=>x.id===b.dataset.s);await sb.from('tasks').update({starred:!t.starred}).eq('id',t.id)});
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>del('tasks',b.dataset.x,'Supprimer cette tâche ?'));
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>taskForm(S.tasks.find(x=>x.id===b.dataset.e)));
  $('#sh').onclick=()=>{S.show=S.show==='all'?'todo':'all';render()};
  $('#q').oninput=e=>{S.q=e.target.value;render();const i=$('#q');i.focus();i.setSelectionRange(i.value.length,i.value.length)};
  $('#add').onclick=()=>taskForm()},
 agenda(){document.querySelectorAll('[data-xe]').forEach(b=>b.onclick=()=>del('events',b.dataset.xe,'Supprimer cet événement ?'));
  $('#add').onclick=()=>{const s=sheet(`<h1>Nouvel événement</h1><input id="et" placeholder="Titre"><input id="ed" type="datetime-local"><input id="el" placeholder="Lieu (optionnel)"><button class="btn" style="width:100%;margin-top:8px" id="ok">Enregistrer</button>`);
   s.querySelector('#ok').onclick=async()=>{const t=s.querySelector('#et').value.trim(),d=s.querySelector('#ed').value;if(!t||!d)return;
    await sb.from('events').insert({title:t,starts_at:new Date(d).toISOString(),location:s.querySelector('#el').value.trim()||null});s.remove()}}},
 chat(){scrollTo(0,document.body.scrollHeight);
  const go=async()=>{const i=$('#mb'),b=i.value.trim();if(!b)return;const r=await sb.from('messages').insert({body:b,author_name:S.me.name||'Étudiant'});if(r.error)return toast('Erreur : '+r.error.message);i.value='';await load();render()};
  $('#send').onclick=go;$('#mb').onkeydown=e=>e.key==='Enter'&&go();
  document.querySelectorAll('[data-xm]').forEach(b=>b.onclick=()=>del('messages',b.dataset.xm,'Supprimer ce message ?'))},
 docs(){
  document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{const d=S.docs.find(x=>x.id===b.dataset.dl);
   const {data,error}=await sb.storage.from('docs').createSignedUrl(d.path,120,{download:d.title});if(error||!data)return toast('Erreur : '+(error?.message||'fichier introuvable'));location.href=data.signedUrl});
  document.querySelectorAll('[data-xd]').forEach(b=>b.onclick=async()=>{if(!confirm('Supprimer ?'))return;const d=S.docs.find(x=>x.id===b.dataset.xd);await sb.storage.from('docs').remove([d.path]);await sb.from('documents').delete().eq('id',d.id)});
  $('#add').onclick=()=>{const s=sheet(`<h1>Partager un document</h1><input id="df" type="file"><p class="err" id="er"></p><button class="btn" style="width:100%" id="ok">Envoyer (20 Mo max)</button>`);
   s.querySelector('#ok').onclick=async()=>{const f=s.querySelector('#df').files[0];if(!f)return;
    const path=`${S.user.id}/${Date.now()}-${f.name.replace(/[^\w.\-]/g,'_')}`;
    const up=await sb.storage.from('docs').upload(path,f);if(up.error){s.querySelector('#er').textContent=up.error.message;return}
    await sb.from('documents').insert({title:f.name,path,size:f.size});s.remove()}}},
 members(){$('#notif').onclick=async()=>{const r=await Notification.requestPermission?.();$('#notif').textContent=r==='granted'?'Rappels activés ✓':'Autorisation refusée'};
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>sb.from('profiles').update({role:b.dataset.ro==='admin'?'student':'admin'}).eq('id',b.dataset.r).then(load).then(render))}
};
function notify(t,b){try{if(Notification.permission==='granted')navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:b,icon:'/icons/icon-192.png'}))}catch(e){}}
function checkReminders(){const seen=JSON.parse(localStorage.getItem('pn-seen')||'[]'),now=Date.now(),add=[];
  S.tasks.filter(t=>!t.done&&t.remind_at&&new Date(t.remind_at)<=now&&now-new Date(t.remind_at)<864e5&&!seen.includes('t'+t.id)&&(t.owner===S.user.id||t.scope==='shared')).forEach(t=>{notify('Rappel',t.title);add.push('t'+t.id)});
  S.events.filter(e=>{const d=new Date(e.starts_at)-now;return d>0&&d<36e5&&!seen.includes('e'+e.id)}).forEach(e=>{notify('Dans moins d\'1 h',e.title);add.push('e'+e.id)});
  if(add.length)localStorage.setItem('pn-seen',JSON.stringify([...seen,...add].slice(-300)))}
boot();
</script></body></html>
